<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stored Records Library - AI SDR Life Science Platform</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #090d16;
            --card-bg: rgba(17, 24, 39, 0.7);
            --card-border: rgba(255, 255, 255, 0.08);
            --accent-violet: #8b5cf6;
            --accent-indigo: #6366f1;
            --accent-cyan: #06b6d4;
            --text-main: #f3f4f6;
            --text-muted: #9ca3af;
            --text-secondary: #cbd5e1;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
        }

        body {
            background-color: var(--bg-dark);
            background-image: 
                radial-gradient(circle at 15% 15%, rgba(99, 102, 241, 0.15) 0%, transparent 40%),
                radial-gradient(circle at 85% 85%, rgba(139, 92, 246, 0.15) 0%, transparent 40%);
            background-attachment: fixed;
            color: var(--text-main);
            min-height: 100vh;
            padding-bottom: 4rem;
        }

        .navbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 1.2rem 2.5rem;
            background: rgba(15, 23, 42, 0.85);
            backdrop-filter: blur(16px);
            border-bottom: 1px solid var(--card-border);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .brand-logo {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            font-weight: 700;
            font-size: 1.25rem;
            color: var(--text-main);
            text-decoration: none;
        }

        .brand-icon {
            width: 38px;
            height: 38px;
            background: linear-gradient(135deg, var(--accent-indigo), var(--accent-violet));
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 14px rgba(99, 102, 241, 0.4);
        }

        .nav-links {
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        .nav-tab {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.55rem 1.25rem;
            border-radius: 8px;
            text-decoration: none;
            font-size: 0.9rem;
            font-weight: 500;
            color: var(--text-muted);
            transition: all 0.2s ease;
        }

        .nav-tab:hover {
            color: var(--text-main);
            background: rgba(255, 255, 255, 0.05);
        }

        .nav-tab.active {
            color: #ffffff;
            background: linear-gradient(135deg, rgba(99, 102, 241, 0.25), rgba(139, 92, 246, 0.25));
            border: 1px solid rgba(139, 92, 246, 0.4);
            box-shadow: 0 4px 12px rgba(139, 92, 246, 0.2);
        }

        .container {
            max-width: 1400px;
            margin: 2rem auto;
            padding: 0 2rem;
        }

        .page-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 2rem;
            flex-wrap: wrap;
            gap: 1rem;
        }

        .header-title h1 {
            font-size: 1.85rem;
            font-weight: 700;
            background: linear-gradient(135deg, #ffffff, #cbd5e1);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .header-title p {
            color: var(--text-muted);
            font-size: 0.925rem;
            margin-top: 0.25rem;
        }

        .export-group {
            display: flex;
            align-items: center;
            gap: 0.75rem;
        }

        .btn-export {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.6rem 1.2rem;
            border-radius: 8px;
            border: 1px solid rgba(255, 255, 255, 0.15);
            background: rgba(255, 255, 255, 0.05);
            color: var(--text-main);
            font-size: 0.875rem;
            font-weight: 500;
            cursor: pointer;
            text-decoration: none;
            transition: all 0.2s ease;
        }

        .btn-export:hover {
            background: rgba(255, 255, 255, 0.12);
            border-color: rgba(255, 255, 255, 0.3);
            transform: translateY(-1px);
        }

        /* Filter Controls */
        .filter-panel {
            background: var(--card-bg);
            backdrop-filter: blur(12px);
            border: 1px solid var(--card-border);
            border-radius: 16px;
            padding: 1.5rem;
            margin-bottom: 2rem;
            display: flex;
            flex-direction: column;
            gap: 1.25rem;
        }

        .search-row {
            display: flex;
            gap: 1rem;
            flex-wrap: wrap;
        }

        .search-box {
            flex: 1;
            min-width: 280px;
            position: relative;
        }

        .search-box input {
            width: 100%;
            padding: 0.75rem 1rem 0.75rem 2.6rem;
            border-radius: 10px;
            border: 1px solid var(--card-border);
            background: rgba(15, 23, 42, 0.6);
            color: var(--text-main);
            font-size: 0.925rem;
            outline: none;
            transition: border-color 0.2s;
        }

        .search-box input:focus {
            border-color: var(--accent-violet);
        }

        .search-box svg {
            position: absolute;
            left: 0.85rem;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted);
        }

        .filter-select {
            padding: 0.75rem 1rem;
            border-radius: 10px;
            border: 1px solid var(--card-border);
            background: rgba(15, 23, 42, 0.8);
            color: var(--text-main);
            font-size: 0.9rem;
            outline: none;
            cursor: pointer;
        }

        .region-pills {
            display: flex;
            align-items: center;
            gap: 0.6rem;
            flex-wrap: wrap;
        }

        .pill-btn {
            padding: 0.45rem 1rem;
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            background: rgba(255, 255, 255, 0.03);
            color: var(--text-muted);
            font-size: 0.85rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .pill-btn:hover {
            color: var(--text-main);
            background: rgba(255, 255, 255, 0.08);
        }

        .pill-btn.active {
            color: #ffffff;
            background: linear-gradient(135deg, var(--accent-indigo), var(--accent-violet));
            border-color: transparent;
            box-shadow: 0 4px 12px rgba(99, 102, 241, 0.35);
        }

        /* Lead Cards List */
        .records-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 1.5rem;
        }

        .lead-card {
            background: var(--card-bg);
            backdrop-filter: blur(12px);
            border: 1px solid var(--card-border);
            border-radius: 16px;
            padding: 1.75rem;
            transition: transform 0.2s, border-color 0.2s;
        }

        .lead-card:hover {
            border-color: rgba(139, 92, 246, 0.3);
            transform: translateY(-2px);
        }

        .lead-top {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 1rem;
            flex-wrap: wrap;
            gap: 1rem;
        }

        .company-name {
            font-size: 1.25rem;
            font-weight: 700;
            color: var(--text-main);
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .lead-meta {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            flex-wrap: wrap;
            margin-top: 0.5rem;
            font-size: 0.85rem;
            color: var(--text-muted);
        }

        .meta-tag {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.08);
            padding: 0.2rem 0.6rem;
            border-radius: 6px;
        }

        .score-badge {
            display: inline-flex;
            align-items: center;
            gap: 0.35rem;
            padding: 0.4rem 0.85rem;
            border-radius: 20px;
            font-weight: 700;
            font-size: 0.875rem;
        }

        .score-high {
            background: rgba(16, 185, 129, 0.15);
            color: #34d399;
            border: 1px solid rgba(52, 211, 153, 0.3);
        }

        .summary-text {
            font-size: 0.9rem;
            color: var(--text-secondary);
            line-height: 1.55;
            margin-bottom: 1.25rem;
        }

        .contacts-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
            gap: 1rem;
            margin-top: 1rem;
            padding-top: 1rem;
            border-top: 1px solid rgba(255, 255, 255, 0.06);
        }

        .contact-card {
            background: rgba(15, 23, 42, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 12px;
            padding: 1rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .contact-info h4 {
            font-size: 0.95rem;
            font-weight: 600;
            color: var(--text-main);
        }

        .contact-info p {
            font-size: 0.8rem;
            color: var(--text-muted);
            margin: 0.15rem 0 0.4rem 0;
        }

        .email-row {
            display: flex;
            align-items: center;
            gap: 0.4rem;
            font-size: 0.8rem;
            color: var(--accent-cyan);
            flex-wrap: wrap;
        }

        .btn-view-seq {
            background: rgba(139, 92, 246, 0.15);
            border: 1px solid rgba(139, 92, 246, 0.3);
            color: #c4b5fd;
            padding: 0.45rem 0.85rem;
            border-radius: 8px;
            font-size: 0.8rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .btn-view-seq:hover {
            background: rgba(139, 92, 246, 0.3);
            color: #ffffff;
        }

        /* Modal */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(8px);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            padding: 2rem;
        }

        .modal-card {
            background: #0f172a;
            border: 1px solid var(--card-border);
            border-radius: 20px;
            max-width: 800px;
            width: 100%;
            max-height: 85vh;
            overflow-y: auto;
            padding: 2rem;
            position: relative;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7);
        }

        .btn-close-modal {
            position: absolute;
            top: 1.25rem;
            right: 1.25rem;
            background: rgba(255, 255, 255, 0.08);
            border: none;
            color: var(--text-muted);
            width: 32px;
            height: 32px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 1.2rem;
        }
    </style>
</head>
<body>

    <!-- Header Navigation Bar -->
    <nav class="navbar">
        <a href="/" class="brand-logo">
            <div class="brand-icon">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/></svg>
            </div>
            AI SDR eQMS Platform
        </a>
        <div class="nav-links">
            <a href="/" class="nav-tab">
                🚀 Producer Scanner
            </a>
            <a href="/records" class="nav-tab active">
                📁 Stored Records Library
            </a>
        </div>
    </nav>

    <div class="container">
        <!-- Page Title -->
        <div class="page-header">
            <div class="header-title">
                <h1>Stored Records & Lead Library 📁</h1>
                <p id="librarySubtitle">Fetching all saved Life Science, API & Formulations producers from PostgreSQL database...</p>
            </div>
            <div class="export-group">
                <a href="/api/sdr/records/export/csv" class="btn-export">📥 Export CSV</a>
                <a href="/api/sdr/records/export/excel" class="btn-export">📊 Export Excel</a>
            </div>
        </div>

        <!-- Filter Controls -->
        <div class="filter-panel">
            <div class="search-row">
                <div class="search-box">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
                    <input type="text" id="searchInput" placeholder="Search saved company names, domains, regions, or keywords..." oninput="filterRecords()">
                </div>
                <select id="sectorFilter" class="filter-select" onchange="filterRecords()">
                    <option value="ALL" selected>All Producer Sectors</option>
                    <option value="Active Pharmaceutical Ingredients (API)">Active Pharmaceutical Ingredients (API)</option>
                    <option value="Pharmaceutical Formulations & Finished Dosage (FDF)">Pharmaceutical Formulations & Finished Dosage (FDF)</option>
                    <option value="Medical Devices">Medical Devices & MedTech</option>
                    <option value="Biotechnology">Biotechnology & Gene Therapy</option>
                </select>
            </div>

            <!-- Regional Filter Pills -->
            <div class="region-pills">
                <button class="pill-btn active" onclick="setRegionFilter('ALL', this)">All Target Regions</button>
                <button class="pill-btn" onclick="setRegionFilter('India', this)">🇮🇳 India</button>
                <button class="pill-btn" onclick="setRegionFilter('Europe', this)">🇪🇺 Europe</button>
                <button class="pill-btn" onclick="setRegionFilter('Middle East', this)">🌍 Middle East</button>
                <button class="pill-btn" onclick="setRegionFilter('North America', this)">🇺🇸 North America</button>
                <button class="pill-btn" onclick="setRegionFilter('Asia-Pacific', this)">🇦🇺 Asia-Pacific</button>
                <button class="pill-btn" onclick="setRegionFilter('South America', this)">🇧🇷 South America</button>
            </div>
        </div>

        <!-- Records Grid -->
        <div id="recordsGrid" class="records-grid">
            <div class="lead-card" style="text-align:center; padding:3rem; color:var(--text-muted);">
                Loading saved records from PostgreSQL database...
            </div>
        </div>
    </div>

    <!-- Sequence Modal -->
    <div id="sequenceModal" class="modal-overlay">
        <div class="modal-card">
            <button class="btn-close-modal" onclick="closeSequenceModal()">&times;</button>
            <h3 id="modalContactTitle" style="color:var(--text-main); font-size:1.2rem; margin-bottom:1rem;"></h3>
            <div id="modalSequenceContent"></div>
        </div>
    </div>

    <script>
        let allLeads = [];
        let activeRegion = 'ALL';

        async function fetchStoredRecords() {
            try {
                const resp = await fetch('/api/sdr/records');
                if (resp.ok) {
                    const data = await resp.json();
                    allLeads = data.leads || [];
                    document.getElementById('librarySubtitle').innerText = `Displaying ${allLeads.length} total qualified Life Science producers stored in PostgreSQL (schema ai_sdr).`;
                    renderRecords(allLeads);
                }
            } catch (err) {
                console.error("Error fetching records:", err);
            }
        }

        function setRegionFilter(region, btnElem) {
            activeRegion = region;
            document.querySelectorAll('.pill-btn').forEach(b => b.classList.remove('active'));
            btnElem.classList.add('active');
            filterRecords();
        }

        function isRegionMatch(activeReg, leadRegion) {
            if (!activeReg || activeReg === 'ALL') return true;
            if (!leadRegion) return false;
            
            const regLower = leadRegion.toLowerCase();
            const activeLower = activeReg.toLowerCase();
            
            if (regLower.includes(activeLower)) return true;

            if (activeLower.includes('middle east')) {
                return regLower.includes('israel') || regLower.includes('uae') || regLower.includes('saudi') || 
                       regLower.includes('jordan') || regLower.includes('dubai') || regLower.includes('tel aviv') || 
                       regLower.includes('ras al khaimah') || regLower.includes('petah tikva') || regLower.includes('riyadh') || 
                       regLower.includes('amman');
            }
            if (activeLower.includes('europe')) {
                return regLower.includes('germany') || regLower.includes('uk') || regLower.includes('switzerland') || 
                       regLower.includes('france') || regLower.includes('italy') || regLower.includes('london') || 
                       regLower.includes('basel') || regLower.includes('göttingen') || regLower.includes('hamburg') || 
                       regLower.includes('melsungen') || regLower.includes('oxford');
            }
            if (activeLower.includes('india')) {
                return regLower.includes('india') || regLower.includes('in') || regLower.includes('hyderabad') || 
                       regLower.includes('gujarat') || regLower.includes('mumbai') || regLower.includes('delhi') || 
                       regLower.includes('noida') || regLower.includes('chennai') || regLower.includes('vadodara') || 
                       regLower.includes('telangana') || regLower.includes('maharashtra');
            }
            if (activeLower.includes('north america') || activeLower.includes('usa') || activeLower.includes('canada')) {
                return regLower.includes('usa') || regLower.includes('canada') || regLower.includes('ontario') || 
                       regLower.includes('quebec') || regLower.includes('vancouver') || regLower.includes('toronto') || 
                       regLower.includes('montreal') || regLower.includes('massachusetts') || regLower.includes('boston') || 
                       regLower.includes('us') || regLower.includes('ca');
            }
            if (activeLower.includes('south america') || activeLower.includes('brazil')) {
                return regLower.includes('brazil') || regLower.includes('argentina') || regLower.includes('mexico') || 
                       regLower.includes('são paulo') || regLower.includes('buenos aires') || regLower.includes('mexico city');
            }
            if (activeLower.includes('asia-pacific') || activeLower.includes('japan')) {
                return regLower.includes('japan') || regLower.includes('singapore') || regLower.includes('south korea') || 
                       regLower.includes('tokyo') || regLower.includes('sejong');
            }
            return false;
        }

        function filterRecords() {
            const search = document.getElementById('searchInput').value.toLowerCase().trim();
            const sector = document.getElementById('sectorFilter').value;

            const filtered = allLeads.filter(lead => {
                // Region filter using smart token matching
                if (!isRegionMatch(activeRegion, lead.region)) {
                    return false;
                }
                // Sector filter
                if (sector !== 'ALL') {
                    const secLower = lead.industry_subsector ? lead.industry_subsector.toLowerCase() : '';
                    if (!secLower.includes(sector.toLowerCase())) return false;
                }
                // Search input filter
                if (search) {
                    const name = lead.name ? lead.name.toLowerCase() : '';
                    const domain = lead.domain ? lead.domain.toLowerCase() : '';
                    const reg = lead.region ? lead.region.toLowerCase() : '';
                    const sum = lead.summary ? lead.summary.toLowerCase() : '';
                    if (!name.includes(search) && !domain.includes(search) && !reg.includes(search) && !sum.includes(search)) {
                        return false;
                    }
                }
                return true;
            });

            renderRecords(filtered);
        }

        function renderRecords(leads) {
            const grid = document.getElementById('recordsGrid');

            if (!leads || leads.length === 0) {
                grid.innerHTML = `
                    <div class="lead-card" style="text-align:center; padding:3rem; color:var(--text-muted);">
                        <p style="font-size:1.1rem; color:var(--text-main); margin-bottom:0.5rem;">No stored records found matching filter criteria.</p>
                        <p style="font-size:0.875rem;">Try selecting 'All Target Regions' or clear search keywords.</p>
                    </div>
                `;
                return;
            }

            grid.innerHTML = leads.map(lead => {
                const fitScore = lead.qms_fit_score || 75;
                const contactsHtml = (lead.contacts || []).map(contact => `
                    <div class="contact-card">
                        <div class="contact-info">
                            <h4>${contact.name}</h4>
                            <p>${contact.title}</p>
                            <div class="email-row">
                                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></svg>
                                ${contact.email}
                                ${contact.linkedin_url ? `
                                    <a href="${contact.linkedin_url}" target="_blank" style="display:inline-flex; align-items:center; gap:0.25rem; text-decoration:none; font-size:0.7rem; color:#60a5fa; background:rgba(37, 99, 235, 0.15); border:1px solid rgba(96, 165, 250, 0.3); padding:0.1rem 0.45rem; border-radius:4px;">
                                        <svg width="11" height="11" viewBox="0 0 24 24" fill="currentColor"><path d="M19 3a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h14m-.5 15.5v-5.3a3.26 3.26 0 0 0-3.26-3.26c-.85 0-1.84.52-2.28 1.3v-1.11h-2.79v8.37h2.79v-4.93c0-.77.62-1.4 1.39-1.4a1.4 1.4 0 0 1 1.4 1.4v4.93h2.75M6.46 10.9v8.37H9.25V10.9H6.46M7.86 6.74a1.48 1.48 0 1 0 0 2.96 1.48 1.48 0 0 0 0-2.96z"/></svg>
                                        LinkedIn
                                    </a>
                                ` : ''}
                            </div>
                        </div>
                        <button class="btn-view-seq" onclick="openModal('${contact.name}', ${JSON.stringify(contact.sequences || []).replace(/"/g, '&quot;')})">
                            View AI Email Sequence →
                        </button>
                    </div>
                `).join('');

                return `
                    <div class="lead-card">
                        <div class="lead-top">
                            <div>
                                <div class="company-name">
                                    ${lead.name}
                                    <a href="${lead.website_url}" target="_blank" style="font-size:0.8rem; color:var(--text-secondary); text-decoration:none;">↗</a>
                                </div>
                                <div class="lead-meta">
                                    <span class="meta-tag">📍 ${lead.region}</span>
                                    <span class="meta-tag">🏷️ ${lead.industry_subsector}</span>
                                    <span class="meta-tag">👥 ${lead.employee_range}</span>
                                    <span class="meta-tag" style="color:#c084fc;">🔍 ${lead.source}</span>
                                </div>
                            </div>
                            <div class="score-badge score-high">
                                eQMS Fit Score: ${fitScore}/100
                            </div>
                        </div>

                        <div class="summary-text">
                            ${lead.summary}
                        </div>

                        <div class="contacts-grid">
                            ${contactsHtml}
                        </div>
                    </div>
                `;
            }).join('');
        }

        function openModal(contactName, sequences) {
            document.getElementById('modalContactTitle').innerText = `AI Email Outreach Sequence for ${contactName}`;
            const container = document.getElementById('modalSequenceContent');
            
            if (!sequences || sequences.length === 0) {
                container.innerHTML = `<p style="color:var(--text-muted);">No email sequences generated for this contact.</p>`;
            } else {
                container.innerHTML = sequences.map(seq => `
                    <div style="background:rgba(255,255,255,0.03); border:1px solid rgba(255,255,255,0.08); padding:1.25rem; border-radius:12px; margin-bottom:1rem;">
                        <div style="display:flex; justify-content:space-between; margin-bottom:0.5rem;">
                            <span style="font-weight:700; color:var(--accent-violet);">Step ${seq.step_number}</span>
                            <span style="font-size:0.8rem; color:var(--text-muted);">Hook: ${seq.personalized_hook || 'ISO Compliance'}</span>
                        </div>
                        <div style="font-weight:600; color:var(--text-main); margin-bottom:0.5rem;">Subject: ${seq.subject}</div>
                        <div style="white-space:pre-wrap; font-size:0.875rem; color:var(--text-secondary); line-height:1.6;">${seq.body_text}</div>
                    </div>
                `).join('');
            }
            
            document.getElementById('sequenceModal').style.display = 'flex';
        }

        function closeSequenceModal() {
            document.getElementById('sequenceModal').style.display = 'none';
        }

        fetchStoredRecords();
    </script>
</body>
</html>
